# Old category URLs (bookmarks, search results) now go to the single category
# route, /category.php?slug=<slug>. Each old file name gets a permanent (301)
# redirect and keeps its query string. The table is the only place old names
# are listed; there are no per-category PHP files.
<Directory ${APACHE_DOCUMENT_ROOT}>
    RewriteEngine On
    RewriteRule ^categories/candles\.php$ /category.php?slug=candles [R=301,L,QSA]
    RewriteRule ^categories/candleSets\.php$ /category.php?slug=candle-sets [R=301,L,QSA]
    RewriteRule ^categories/candle-sets\.php$ /category.php?slug=candle-sets [R=301,L,QSA]
    RewriteRule ^categories/candleBouquets\.php$ /category.php?slug=bouquets [R=301,L,QSA]
    RewriteRule ^categories/candle-bouquets\.php$ /category.php?slug=bouquets [R=301,L,QSA]
    RewriteRule ^categories/eventFavors\.php$ /category.php?slug=event-favors [R=301,L,QSA]
    RewriteRule ^categories/event-favors\.php$ /category.php?slug=event-favors [R=301,L,QSA]
    RewriteRule ^categories/homeDiffusers\.php$ /category.php?slug=home-diffusers [R=301,L,QSA]
    RewriteRule ^categories/home-diffusers\.php$ /category.php?slug=home-diffusers [R=301,L,QSA]
    RewriteRule ^categories/accessories\.php$ /category.php?slug=accessories [R=301,L,QSA]
</Directory>
